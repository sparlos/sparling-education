[project]
name = "voice-synth"
version = "0.0.0"
description = "Thin Kokoro synthesis worker for @repo/voice (reads JSON on stdin, writes MP3s)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx-audio",
  "misaki",
  "espeakng-loader",
  "spacy",
  "phonemizer-fork",
  "num2words",
  "en-core-web-sm",
]

[project.scripts]
synth = "synth.cli:main"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synth"]
