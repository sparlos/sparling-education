<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 100" width="110" height="100">
  <!-- Output counter under a tube (Correct digit state). Draw the digit in code, centred at (55,56), light colour (#fdfbff). -->
  <defs>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a7350"/><stop offset="1" stop-color="#1f5a3d"/>
    </linearGradient>
  </defs>
  <g stroke="#2b2350" stroke-width="3" stroke-linejoin="round">
    <rect x="3" y="3" width="104" height="94" rx="14" fill="#4cc38a"/>
    <path d="M14 12 h82" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".55"/>
    <rect x="13" y="18" width="84" height="70" rx="8" fill="url(#scr)"/>
    <path d="M21 26 h30" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".18"/>
    <path d="M13 53 h84" stroke="#000" stroke-width="1.5" opacity=".18"/>
  </g>
