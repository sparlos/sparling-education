    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f2ea"/><stop offset="1" stop-color="#e7e0d2"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e86c4"/><stop offset="1" stop-color="#6c63a6"/>
    </linearGradient>
  </defs>
  <g stroke="#2b2350" stroke-width="4" stroke-linejoin="round">
    <path d="M20 60 q0-40 40-40 h1400 q40 0 40 40 v620 q0 90-90 90 h-1300 q-90 0-90-90 z" fill="url(#body)"/>
    <path d="M44 70 q0-26 26-26 h1380 q26 0 26 26" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".9"/>
    <g fill="#ddd4c2" stroke-width="2.5">
      <rect x="64" y="166" width="251" height="490" rx="28"/><rect x="444" y="166" width="251" height="490" rx="28"/><rect x="824" y="166" width="251" height="490" rx="28"/><rect x="1204" y="166" width="251" height="490" rx="28"/>
    </g>
    <path d="M24 664 H1496" fill="none" stroke-width="3" opacity=".25"/>
    <rect x="20" y="660" width="1480" height="10" fill="url(#band)" stroke="none"/>
    <g fill="#c8c2ef" stroke-width="2.5">
      <circle cx="60" cy="100" r="7"/><circle cx="60" cy="360" r="7"/><circle cx="60" cy="600" r="7"/><circle cx="1460" cy="100" r="7"/><circle cx="1460" cy="360" r="7"/><circle cx="1460" cy="600" r="7"/>
    </g>
