<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40">
  <!-- Tileable track (period 120px). Rail top at y=6. Rotate the tiled strip to match the slope; wheels sit on y=6. -->
  <g stroke="#2b2350" stroke-width="2.5" stroke-linejoin="round">
    <rect x="6" y="14" width="18" height="20" rx="3" fill="#6e5a46"/>
    <rect x="46" y="14" width="18" height="20" rx="3" fill="#6e5a46"/>
    <rect x="86" y="14" width="18" height="20" rx="3" fill="#6e5a46"/>
    <rect x="-2" y="6" width="124" height="12" rx="0" fill="#5a527e"/>
  </g>
  <path d="M0 9 H120" stroke="#9a93c9" stroke-width="3"/>
</svg>
